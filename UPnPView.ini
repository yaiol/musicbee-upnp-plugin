<?xml version="1.0" encoding="utf-8"?>
<UPnPView xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xmlns:xsd="http://www.w3.org/2001/XMLSchema">
  <!--
    Default UPnP view setup shipped with the plugin. Extracted to
    %AppData%\MusicBee\UPnPView.ini on first run. User edits / adds / deletes freely.

    Sections:
      Templates - named path bundles. Each has a stable Key (its identity - what endpoint
                  bindings reference) and a free display Name. Keys are GUIDs: the shipped
                  templates carry global fixed values (identical on every machine, and known
                  to the plugin code for the three that seed new endpoints), user-created
                  templates get a generated one. The plugin also seeds two more templates in
                  code (Radio, Podcasts - the starters of their categories).
                  Defaults bound to newly-discovered nodes:
                    Tracks          - playlists + Now Playing
                    by Album Artist - filters, Inbox, Audiobooks
                    Music           - the Music node
                  The remaining templates are examples - followed by nothing, freely
                  deletable. No template is reserved: deletion is simply unavailable while
                  any node follows the template.
      EndpointBindings - per-endpoint state: TemplateKey is which template the endpoint
                  follows (editing a template re-shapes every endpoint bound to it). A bound
                  binding stores ONLY the TemplateKey - its paths come from the template at
                  load. Only an unbound binding (empty TemplateKey - it follows nothing)
                  stores its own Paths.

    Template Paths each have:
      - Hierarchy : ordered list of Level entries. Each Level has Field (a MetaDataType name
                    like Composer, AlbumArtist, Genre, Virtual1, Custom2, ...) and an optional
                    BucketByLetter flag that inserts a Letter bucket layer above the field.
      - Leaf      : AT (Album > Tracks) or T (Flat Tracks).
      - IncludeAllTracks : true to add an [All Tracks] entry at each intermediate level
                           (AT-only meaningful).
      - AlbumGroupBy     : ordered Field list defining album identity + title + sort at the
                           AT leaf (default Album).
  -->
  <Templates>
    <Template>
      <Key>fdfdea1912a64acf8ed4fbb2505956cc</Key>
      <Name>Tracks</Name>
      <Paths>
        <Path>
          <Hierarchy />
          <Leaf>T</Leaf>
        </Path>
      </Paths>
    </Template>
    <Template>
      <Key>94075c21b4184aeda59f8b69cff334c3</Key>
      <Name>Music</Name>
      <!-- Multi-path templates must NOT include a path with empty Hierarchy (i.e.
           Tracks "T" or Album/Tracks "AT"). Such a path resolves directly to the
           container's children with no extra grouping level, which conflicts with
           the wrapper that multi-path mode introduces: the user ends up with a
           sub-container labelled "Album / Tracks" or "Tracks" sitting next to
           real grouping paths, and click-through navigates through an extra
           level the other paths don't have. Reserve empty-hierarchy paths for
           SINGLE-path templates only (like "Tracks"). -->
      <Paths>
        <Path>
          <Hierarchy>
            <Level><Field>Artist</Field></Level>
          </Hierarchy>
          <Leaf>AT</Leaf>
          <IncludeAllTracks>true</IncludeAllTracks>
        </Path>
        <Path>
          <Hierarchy>
            <Level><Field>AlbumArtist</Field></Level>
          </Hierarchy>
          <Leaf>AT</Leaf>
          <IncludeAllTracks>true</IncludeAllTracks>
        </Path>
        <Path>
          <Hierarchy>
            <Level><Field>Composer</Field></Level>
          </Hierarchy>
          <Leaf>AT</Leaf>
          <IncludeAllTracks>true</IncludeAllTracks>
        </Path>
        <Path>
          <Hierarchy>
            <Level><Field>Genre</Field></Level>
          </Hierarchy>
          <Leaf>AT</Leaf>
          <IncludeAllTracks>true</IncludeAllTracks>
        </Path>
        <Path>
          <Hierarchy>
            <Level><Field>Year</Field></Level>
          </Hierarchy>
          <Leaf>AT</Leaf>
          <IncludeAllTracks>true</IncludeAllTracks>
        </Path>
      </Paths>
    </Template>
    <Template>
      <Key>53ff60cde88d44f3b28df4e5cc9dedbd</Key>
      <Name>by Album Artist</Name>
      <Paths>
        <Path>
          <Hierarchy>
            <Level><Field>AlbumArtist</Field></Level>
          </Hierarchy>
          <Leaf>AT</Leaf>
        </Path>
      </Paths>
    </Template>
    <Template>
      <Key>4ff2da7fea5c44c1a276d7289997de6e</Key>
      <Name>by Composer</Name>
      <Paths>
        <Path>
          <Hierarchy>
            <Level><Field>Composer</Field></Level>
          </Hierarchy>
          <Leaf>AT</Leaf>
        </Path>
      </Paths>
    </Template>
    <Template>
      <Key>e905441254014f4eb75447bae0c2f263</Key>
      <Name>by Genre / Artist</Name>
      <Paths>
        <Path>
          <Hierarchy>
            <Level><Field>Genre</Field></Level>
            <Level><Field>AlbumArtist</Field></Level>
          </Hierarchy>
          <Leaf>AT</Leaf>
        </Path>
      </Paths>
    </Template>
    <Template>
      <Key>fab5b09245ee4a7c9cc3399cf89fd777</Key>
      <Name>by Year / Artist</Name>
      <Paths>
        <Path>
          <Hierarchy>
            <Level><Field>Year</Field></Level>
            <Level><Field>AlbumArtist</Field></Level>
          </Hierarchy>
          <Leaf>AT</Leaf>
        </Path>
      </Paths>
    </Template>
  </Templates>
</UPnPView>
